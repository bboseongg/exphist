name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Project site → https://<owner>.github.io/<repo>/ (astro.config.mjs turns a
  # "<owner>.github.io" repository into a root site automatically).
  SITE: https://${{ github.repository_owner }}.github.io
  BASE_PATH: /${{ github.event.repository.name }}
  PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Physics tests (cosmology.ts vs astropy reference values)
        run: npm test
      - name: Build (validates every data/papers/*.json against the schema)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
